{% extends "Base.html" %} 

{% block contenido %}

<h1 class="text-center">Calculadora GCT</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div style="color: red;">{{ msg }}</div>
    {% endfor %}
{% endwith %}

{% if resultado %}
    <p><strong>Resultado:</strong> {{ resultado }}</p>
{% endif %}

<form method="post" action="{{ url_for('gct') }}">
    <label>TMB (kcal/día):</label><br>
    <input type="text" name="tmb" value="{{ form.tmb if form else '' }}"><br /><br />

    <label>Actividad:</label><br>
    <select name="actividad">
        <option value="Sedentario" {% if form and form.actividad == 'Sedentario' %}selected{% endif %}>Sedentario (poco o ningún ejercicio)</option>
        <option value="Ligera" {% if form and form.actividad == 'Ligera' %}selected{% endif %}>Ligera (ejercicio ligero 1-3 días/semana)</option>
        <option value="Moderada" {% if form and form.actividad == 'Moderada' %}selected{% endif %}>Moderada (ejercicio moderado 3-5 días/semana)</option>
        <option value="Intensa" {% if form and form.actividad == 'Intensa' %}selected{% endif %}>Intensa (ejercicio intenso 6-7 días/semana)</option>
        <option value="Muy Intensa" {% if form and form.actividad == 'Muy Intensa' %}selected{% endif %}>Muy Intensa (entrenamiento muy intenso o trabajo físico)</option>
    </select><br /><br />

    <button type="submit">Calcular GCT</button>
</form>


{% endblock contenido %}
